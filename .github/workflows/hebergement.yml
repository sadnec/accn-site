# Teste le script PHP des formulaires, puis publie le site sur l'hébergement cPanel (o2switch, Hostinger…)
# Le déploiement ne se fait que si les secrets FTP sont renseignés dans GitHub (voir README).
name: Hébergement (tests + déploiement FTP)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: hebergement-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version de PHP
        run: php -v
      - name: Syntaxe des fichiers PHP
        run: for f in public/api/*.php; do php -l "$f"; done
      - name: Tests du formulaire
        run: bash tests/formulaire.sh

  deploiement:
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Secrets FTP absents
        if: env.FTP_SERVER == ''
        run: echo "::notice::Secrets FTP non configurés dans GitHub, déploiement ignoré."
      - uses: actions/checkout@v4
        if: env.FTP_SERVER != ''
      - uses: actions/setup-node@v4
        if: env.FTP_SERVER != ''
        with:
          node-version: 20
      - name: Génération des pages
        if: env.FTP_SERVER != ''
        env:
          SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE || 'false' }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node build.mjs
      - name: Envoi sur l'hébergement
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./public/
          server-dir: ${{ vars.FTP_SERVER_DIR || './public_html/' }}
