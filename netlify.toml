# Configuration Netlify : génère les pages puis publie le dossier public/
[build]
  command = "node build.mjs"
  publish = "public"

# Netlify n'exécute pas le PHP : on n'expose pas le script d'envoi sur la version de présentation
[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404
  force = true
